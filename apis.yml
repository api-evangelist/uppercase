apis:
- name: Uppercase Storefront Agent Commerce (UCP/MCP)
  description: >-
    Agent-driven shopping surface on the uppercase storefront implementing the
    Universal Commerce Protocol over MCP: discover via /.well-known/ucp, then
    search_catalog, create_cart, create_checkout, update_checkout, and
    complete_checkout (buyer approval required for payment). Read-only product
    and collection JSON is available without authentication.
