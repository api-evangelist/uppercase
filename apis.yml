aid: uppercase
name: Uppercase
description: >-
  Uppercase is an Accel-backed, design-first and environmentally sensitive
  Indian travel-gear brand selling backpacks, trolley bags, duffles, messenger
  and sling bags direct-to-consumer at uppercase.co.in. The Shopify-powered
  storefront is notably agent-ready: it publishes /llms.txt and /agents.md
  agent instructions, a Universal Commerce Protocol (UCP) merchant profile at
  /.well-known/ucp, a live MCP shopping endpoint at /api/ucp/mcp (catalog
  search, cart, checkout with buyer-approved payment), OIDC/OAuth 2.0 customer
  authentication, and unauthenticated product/collection JSON for read-only
  agents.
